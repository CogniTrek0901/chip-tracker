name: 小功能資料

on:
  schedule:
    # GitHub 排程常延遲數小時或漏跑，所以多設備援時段（台北時間）：
    # 17:07、17:37、21:47、22:27、23:07、23:47、00:07、05:37、08:17、08:57、09:37
    # 每次先由 scripts/plan_run.py 判斷：當天融資等資料還沒到就跑全部（all），已是最新就只更新富台指（ft）
    - cron: "7 9 * * 1-5"
    - cron: "37 9 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "27 14 * * 1-5"
    - cron: "7 15 * * 1-5"
    - cron: "47 15 * * 1-5"
    - cron: "7 16 * * 1-5"
    - cron: "37 21 * * 1-5"
    - cron: "17 0 * * 1-5"
    - cron: "57 0 * * 1-5"
    - cron: "37 1 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "all＝全部、ft＝只更新富台指"
        required: false
        default: "all"
      budget:
        description: "補歷史資料最多幾分鐘（第一次補 10 年請填 300）"
        required: false
        default: "15"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tools
  cancel-in-progress: false

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 判斷模式
        run: python -u scripts/plan_run.py tools
        env:
          INPUT_MODE: ${{ inputs.mode }}
      - name: K 線（亞當理論）
        if: env.MODE == 'all'
        run: python -u scripts/fetch_kline.py
        continue-on-error: true
      - name: 抓取小功能資料
        run: python -u scripts/fetch_tools.py "$MODE"
        env:
          TOOLS_BUDGET_MIN: ${{ inputs.budget || '15' }}
        continue-on-error: true
      - name: 提交資料
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tools site/data/tools site/data/k
          git diff --cached --quiet && exit 0
          git commit -m "小功能資料 $(date -u +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
      - name: 加上版本號避免瀏覽器快取舊檔
        run: sed -i -E "s#(src|href)=\"([a-z]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA::7}\"#g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        continue-on-error: true
