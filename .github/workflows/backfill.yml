name: 回補歷史資料（手動）

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "回補最近幾週（全市場每週約 30–40 分鐘，可分多次執行，會自動接續）"
        default: "8"
      minutes:
        description: "本次最長執行分鐘數（上限約 330）"
        default: "300"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chip-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 確保有最新一週與股票清單
        run: python scripts/fetch_weekly.py
      - name: 回補
        run: python scripts/backfill.py --weeks "${{ inputs.weeks }}" --max-minutes "${{ inputs.minutes }}"
        continue-on-error: true
      - name: 產生網站資料
        run: python scripts/build_summary.py
      - name: 提交資料（含未完成的進度）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "回補歷史資料 $(date -u +%F)"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
