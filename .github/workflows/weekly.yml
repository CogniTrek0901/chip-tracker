name: 每週更新籌碼資料

on:
  schedule:
    # 集保資料約在週五晚間～週六公布；台北時間 週六 10:07 與 週日 10:07 各跑一次（第二次是保險，已有資料會自動略過）
    - cron: "7 2 * * 6"
    - cron: "7 2 * * 0"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/*.html", "site/*.js", "site/*.css", "site/data/themes.json", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chip-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 抓取最新一週
        run: python scripts/fetch_weekly.py
      - name: 補齊各週收盤價
        run: python scripts/fetch_prices_hist.py
        continue-on-error: true
      - name: 產生網站資料並提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "資料更新 $(date -u +%F)"
          git pull --rebase -X theirs origin main
          python scripts/build_summary.py
          git add site/data
          git diff --cached --quiet || git commit -m "更新網站資料 $(date -u +%F)"
          git push
      - name: 加上版本號避免瀏覽器快取舊檔
        run: sed -i -e "s#href=\"style.css\"#href=\"style.css?v=${GITHUB_SHA::7}\"#" -e "s#src=\"app.js\"#src=\"app.js?v=${GITHUB_SHA::7}\"#" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
